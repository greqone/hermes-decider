name: decider
label: System-1 Decider
kind: community
version: 1.2.0
author: greqone
homepage: https://github.com/greqone/hermes-decider
description: >
  System-1 Decider auto-router for Hermes subagent delegation (`/v1/systemone`). Evaluates
  unassigned `delegate_task` spawns in a single batched forward pass (noul specialist gate +
  route choice) against your local decision server (e.g. Ollama `pplx-decider:27b-nvfp4`),
  both as a standalone `delegation.backend: decider` and alongside `model_map` routes. Local-only
  by default (fallback off, zero environment variables, zero manual `.env` reads; optional
  host-locked HTTPS keys `DECIDER_API_KEY` and `DECIDER_FALLBACK_API_KEY` read exclusively via
  `agent.secret_scope.get_secret`). Ships CLI (`hermes decider`), slash (`/decider`), and Hermes
  Desktop UI.
requires_hermes: ">=0.22.5"
provides_tools: []
provides_hooks:
  - pre_tool_call
requires_env: []
config_schema:
  enabled:
    type: bool
    default: true
    label: Auto-route unassigned subagents
    description: "Route delegate_task items that omit `option` via your /v1/systemone endpoint."
  url:
    type: str
    default: "http://127.0.0.1:11434/v1/systemone"
    label: Primary /v1/systemone URL
    description: "Local System-1 Decider endpoint (e.g. Ollama serving pplx-decider:27b-nvfp4)."
  primary_model:
    type: str
    default: "pplx-decider:27b-nvfp4"
    label: Primary decision model
    description: "Decision model name sent to the primary endpoint."
  api_key:
    type: secret
    env: DECIDER_API_KEY
    label: Primary endpoint API key
    description: "Optional Bearer token for an authenticated HTTPS primary endpoint (never sent to local Ollama or fallback hosts)."
  allow_fallback:
    type: bool
    default: false
    label: Secondary fallback endpoint (opt-in)
    description: "Off by default so task text never leaves the machine unless you explicitly enable a secondary URL."
  fallback_url:
    type: str
    default: ""
    label: Fallback /v1/systemone URL
    description: "Optional secondary /v1/systemone endpoint used only when allow_fallback is true."
  fallback_model:
    type: str
    default: "jev-latest"
    label: Fallback decision model
    description: "Decision model name sent to the fallback endpoint when allow_fallback is true."
  fallback_api_key:
    type: secret
    env: DECIDER_FALLBACK_API_KEY
    label: Fallback endpoint API key
    description: "Optional Bearer token dedicated strictly to fallback_url over HTTPS (never sent to other hosts)."
  specialist_threshold:
    type: float
    default: 0.70
    label: Specialist threshold (0-1)
    description: "Minimum noul probability required before upgrading away from the default route."
  confidence_threshold:
    type: float
    default: 0.60
    label: Route confidence threshold (0-1)
    description: "Minimum choice confidence required for the selected specialist route."
  timeout:
    type: float
    default: 18.0
    label: Request timeout (seconds)
    description: "HTTP timeout per /v1/systemone decision request (1-120s)."
